services:
  mysql:
    image: mysql:8.0
    container_name: lab_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: orders_db
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  kafka:
    image: apache/kafka:3.7.0
    container_name: lab_kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwMTJERTRjQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT://:9092,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: lab_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    command: >
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic order-events --partitions 3 --replication-factor 1
      && echo "topic order-events created with 3 partitions"

  kafka-ui:
    image: redpanda-data/kafka-ui:latest
    container_name: lab_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8002:8090"
    environment:
      KAFKA_UI_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_UI_CLUSTERS_0_NAME: "lab-cluster"
    networks:
      - backend

  # ===== P2 (RabbitMQ engineer) =====
  # RabbitMQ with Management plugin: AMQP 5672 + web UI 15672.
  # Healthcheck: node check -> service only becomes "healthy" when the broker is fully up.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: lab_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP (default guest:guest)
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping >/dev/null 2>&1 && rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===== P1 (Kafka engineer) =====
  # Flask order handler: POST /api/orders -> MySQL + Kafka (RabbitMQ added in step 6).
  flask:
    image: lab-python:py311
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: lab_flask
    restart: unless-stopped
    command: ["python", "app.py"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_DATABASE: orders_db
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "order-events"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_QUEUE: "order-notifications"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:5000/api/health', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ===== P1 (Kafka engineer) =====
  # nginx: serves the static HTML form (web/) and proxies /api/* to the Flask service.
  nginx:
    image: nginx:1.25
    container_name: lab_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      flask:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql_data:
  kafka_data:

networks:
  backend:
    driver: bridge

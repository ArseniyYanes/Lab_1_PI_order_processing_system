server {
    listen 80;
    server_name _;

    # Static files: the order form (web/ mounted read-only)
    root /usr/share/nginx/html;
    index index.html;

    # API requests -> Flask service (same backend network).
    # A variable + runtime resolver is used so that nginx re-resolves the
    # Flask container's IP after its restart/recreation instead of caching
    # the stale IP forever (which caused 502s after `docker compose up`
    # recreated the flask container).
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $flask_upstream http://flask:5000;
        proxy_pass $flask_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: serve the static HTML form
    location / {
        try_files $uri $uri/ =404;
    }
}
